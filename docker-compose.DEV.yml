services:
  postgres:
    image: postgres:16-alpine
    container_name: nerdinzzz-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: nerdinzzz-bot
    command: sh -c "watchfiles --ignore-paths .venv --ignore-paths .idea 'python run.py' ."
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv  # preserve built venv (bind mount would clobber it otherwise)
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  pgdata: