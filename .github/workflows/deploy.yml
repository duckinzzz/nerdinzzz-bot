name: Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha, mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /srv/bots/nerdinzzz-bot

            cat > .env <<EOF
            ENV=${{ secrets.ENV }}
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            BOT_USERNAME=${{ secrets.BOT_USERNAME }}
            LLM_TOKEN=${{ secrets.LLM_TOKEN }}
            STT_TOKEN=${{ secrets.STT_TOKEN }}
            TTS_TOKEN=${{ secrets.TTS_TOKEN }}

            WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}
            WEBHOOK_PATH=${{ secrets.WEBHOOK_PATH }}
            WEBHOOK_HOST=${{ secrets.WEBHOOK_HOST }}
            WEBHOOK_PORT=${{ secrets.WEBHOOK_PORT }}

            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}

            CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
            CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
            BOTSTATS_API_TOKEN=${{ secrets.BOTSTATS_API_TOKEN }}
            EOF

            IMAGE_TAG=${{ github.sha }}

            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
